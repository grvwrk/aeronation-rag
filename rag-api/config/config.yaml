HF_EMBED: "sentence-transformers/all-MiniLM-L6-v2"
HF_EMBED_MAX_LENGTH: 512

COHERE_RERANKER: rerank-v4.0-fast
LLM_MODEL_TYPE: GROQ
PROMPT_DIR: prompts

OPENAI:
  MODEL_NAME: gpt-4o
  MAX_TOKENS: 4096
  TEMPERATURE: 0.7
  TOP_P: 0.7
  REQUEST_TIMEOUT: 180.0
  
OLLAMA:
  MODEL_NAME: llama3.1:8b
  CTX_LENGTH: 32768
  PREDICT_LENGTH: 4096
  TEMPERATURE: 0.7
  TOP_P: 0.7
  REQUEST_TIMEOUT: 600.0

ANTHROPIC:
  MODEL_NAME: claude-3-sonnet-20240229
  MAX_TOKENS: 4096
  TEMPERATURE: 0.7
  REQUEST_TIMEOUT: 180.0

GROQ:
  MODEL_NAME: openai/gpt-oss-20b
  MAX_TOKENS: 1200
  TEMPERATURE: 0.7
  REQUEST_TIMEOUT: 180.0
  API_BASE: https://api.groq.com/openai/v1

PDF_BASE_URL: https://aeronation-rag-test-log-and-chat-history.s3.ap-south-1.amazonaws.com/pdfs/
S3_LOGS_BUCKET: aeronation-rag-test-log-and-chat-history
S3_CHAT_HISTORY: chat_logs
S3_PERSIST_BUCKET: aeronation-rag-test-log-and-chat-history
S3_PERSIST_DIR: "persist"

AWS_REGION: ap-south-1
SECRETS_MANAGER: aeronation/rag/test/api-keys
CLOUDWATCH_LOG_GROUP: altgan-log-group
CLOUDWATCH_LOG_STREAM: altgan-log-stream

QDRANT_ENABLE_HYBRID: False
FASTEMBED_SPARSE_MODEL: "Qdrant/bm42-all-minilm-l6-v2-attentions"
RAG_SIMILARITY_CUTOFF: 0.50
RAG_SIMILARITY_TOP_K: 3
RAG_RERANKED_TOP_N: 3
RAG_CITATION_CHUNK_SIZE: 128
RAG_CITATION_CHUNK_OVERLAP: 8
RAG_STREAMING: True
RAG_ENABLE_QUERY_REPHRASE: false
# Optional USD rates per 1,000 tokens used by telemetry cost estimates.
LLM_INPUT_COST_PER_1K: 0
LLM_OUTPUT_COST_PER_1K: 0